[project]
name = "kingkai"
version = "0.0.0"
description = "A Textual TUI that watches Claude Code live."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2",
    "aiohttp>=3.14",
    "msgspec>=0.22",
    "cyclopts>=5.2",
]

[project.optional-dependencies]
django = ["django>=5.2"]

[project.scripts]
kingkai = "kingkai.cli:main"
kingkai-hook = "kingkai.hook_client.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.17.*",
    "mypy==2.4.*",
    "import-linter==2.15.*",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.4",
    "pytest-textual-snapshot>=1.1",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "textual-dev>=1.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["integration: needs tmux"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "examples"]

[tool.ruff.lint]
extend-select = [
    "ANN", "ASYNC", "S", "TRY", "PTH", "DTZ", "FBT", "ARG", "ERA", "T20",
    "BLE", "PL", "TC", "FURB", "RUF", "SLF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "FBT", "SLF001"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
